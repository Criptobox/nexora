<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXORA — AI Web Creation Engine</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dot"></span> NEXORA</div>
  <nav class="modes" aria-label="Modos">
    <button class="mode is-active" data-mode="create">Create</button>
    <button class="mode" data-mode="design">Design</button>
    <button class="mode" data-mode="preview">Preview</button>
    <button class="mode" data-mode="qa">QA</button>
  </nav>
  <div class="status" id="health">conectando…</div>
</header>

<main class="layout">
  <aside class="panel panel-left">
    <h2 class="panel-title">Proyecto</h2>
    <form id="brief-form">
      <label for="brief">Brief</label>
      <textarea id="brief" rows="5" placeholder="Crea una web premium para una hamburguesería frente al mar, juvenil pero elegante, con menú y pedidos por WhatsApp."></textarea>
      <label for="autonomy">Autonomía</label>
      <select id="autonomy">
        <option value="balanced">Balanced — pregunta solo lo importante</option>
        <option value="guided">Guided — pregunta más</option>
        <option value="autonomous">Autonomous — decide todo</option>
        <option value="expert">Expert — control total</option>
      </select>
      <button class="btn" type="submit">Crear</button>
    </form>
    <h2 class="panel-title">Agent activity</h2>
    <ol class="phases" id="phases"></ol>
  </aside>

  <section class="canvas">
    <div class="canvas-head">
      <span id="canvas-label">Live canvas</span>
      <div class="viewports">
        <button data-vp="375" class="vp">375</button>
        <button data-vp="768" class="vp">768</button>
        <button data-vp="100%" class="vp is-active">full</button>
      </div>
    </div>
    <div class="canvas-body">
      <iframe id="preview" title="Preview del sitio generado" sandbox="allow-scripts allow-forms"></iframe>
      <div class="empty" id="empty">El preview aparecerá aquí cuando termine la generación.</div>
    </div>
  </section>

  <aside class="panel panel-right">
    <h2 class="panel-title">Issues</h2>
    <ul class="issues" id="issues"><li class="muted">Sin issues todavía.</li></ul>
    <h2 class="panel-title">Verificación</h2>
    <div id="gate" class="gate muted">Pendiente de ejecución.</div>
  </aside>
</main>

<footer class="logs"><pre id="log"></pre></footer>
<script src="app.js"></script>
</body>
</html>
