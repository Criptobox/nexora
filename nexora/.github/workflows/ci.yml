name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificación completa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Typecheck + build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests
        run: node --test tests/unit tests/integration

      - name: E2E tests
        run: node --test tests/e2e
        env:
          NEXORA_LOG_SILENT: '1'

      - name: Golden projects (anti-regresión)
        run: node scripts/golden.mjs

      - name: Benchmark interno
        run: node scripts/benchmark.mjs

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Verificar que no hay secretos en el repo
        run: |
          if grep -rEn "(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{30,})" \
             --include='*.ts' --include='*.js' --include='*.json' --include='*.md' \
             --exclude-dir=node_modules --exclude-dir=dist .; then
            echo "❌ Posible secreto en el repositorio"; exit 1
          fi
          echo "✅ Sin secretos detectados"

  visual:
    name: Visual QA con navegador real
    runs-on: ubuntu-latest
    # Solo para cambios que afectan a lo visual (plan §73)
    if: contains(github.event.pull_request.labels.*.name, 'visual') || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install
      - run: npm run build
      - name: Instalar Playwright
        run: npm i -D playwright && npx playwright install --with-deps chromium
      - name: Generar y observar con navegador
        run: |
          node apps/cli/dist/index.js create \
            "Crea una web premium para una hamburguesería frente al mar con menú y pedidos por WhatsApp" \
            --out ./ci-output --autonomous
          cat ./ci-output/REPORT.md
      - name: Verificar que el navegador se usó de verdad
        run: |
          grep -q "Observación con navegador real: sí" ./ci-output/REPORT.md \
            || { echo "❌ El informe no confirma observación con navegador"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-y-reporte
          path: |
            ci-output/REPORT.md
            ci-output/.nexora/artifacts/screenshots/
